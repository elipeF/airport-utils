name: Update IATA→Timezone & Geo Mapping

on:
  schedule:
    - cron: '0 0 * * *' # every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-mapping
  cancel-in-progress: false

jobs:
  refresh-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate updated mapping
        run: npm run update:mapping

      - name: Validate updated mapping
        run: npm test

      - name: Create or update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.BOT_MAINTAINER_TOKEN != '' && secrets.BOT_MAINTAINER_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: 'chore(mapping): daily update of mapping files'
          branch: chore/mapping-auto
          title: 'chore(mapping): daily update of mapping files'
          body: 'Automated OPTD mapping update with source hash and dataset quality validation.'
          labels: dependencies
          delete-branch: true
          add-paths: |
            src/mapping/geo.ts
            src/mapping/timezones.ts
